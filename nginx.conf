server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # serve dotfiles in .well-known (default nginx config denies them)
    location ^~ /.well-known/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600";
        types { }
        default_type application/octet-stream;
        # explicit types for known files
        location = /.well-known/api-catalog { default_type application/linkset+json; }
        location = /.well-known/ai-catalog.json { default_type application/json; }
        location = /.well-known/agent-skills/index.json { default_type application/json; }
        location = /.well-known/agent-skills/search-channel.json { default_type application/json; }
        location = /.well-known/agent-skills/trending-searches.json { default_type application/json; }
        location = /.well-known/mcp/server-card.json { default_type application/json; }
        try_files $uri =404;
    }

    # RFC 8288 Link headers for agent discovery
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </.well-known/agent-skills/index.json>; rel="service-doc", </.well-known/mcp/server-card.json>; rel="service-desc", </.well-known/ai-catalog.json>; rel="alternate", </auth.md>; rel="service-doc", </health>; rel="status"' always;

    # Markdown for Agents: Accept: text/markdown -> serve .md variant
    location = / {
        if ($http_accept ~* "text/markdown") { rewrite ^ /index.md last; }
        try_files /index.html =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # long-cache static assets
    location ~* \.(png|svg|ico|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml text/markdown application/linkset+json;
}
